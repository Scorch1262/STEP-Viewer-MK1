name: Build STEP-Viewer-MK1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  windows:
    name: Windows (exe + Setup)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Icon und Versionsinfo erzeugen
        id: ver
        shell: bash
        run: |
          python tools/make_icon.py
          VERSION=$(python tools/make_version_info.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: exe bauen (PyInstaller)
        run: pyinstaller --noconfirm STEP-Viewer-MK1.spec

      - name: Selbsttest (Beispieldatei laden)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\STEP-Viewer-MK1\STEP-Viewer-MK1.exe" `
               -ArgumentList '--selftest', 'beispiele\Halter-Baugruppe.step' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Code $($p.ExitCode))" }

      - name: Starttest Oberfläche (Fenster + 3D-Ansicht)
        continue-on-error: true
        shell: pwsh
        run: |
          # Der Runner hat keine Grafikkarte (nur OpenGL 1.1). Für den Test wird die
          # Software-OpenGL-Bibliothek von Qt (Mesa) neben die exe gelegt und danach entfernt.
          $sw = Get-ChildItem -Recurse -Filter opengl32sw.dll dist\STEP-Viewer-MK1 | Select-Object -First 1
          if (-not $sw) { $sw = Get-ChildItem -Recurse -Filter opengl32sw.dll (python -c "import PySide6,os;print(os.path.dirname(PySide6.__file__))") | Select-Object -First 1 }
          if ($sw) { Copy-Item $sw.FullName "dist\STEP-Viewer-MK1\opengl32.dll"; Write-Host "Software-OpenGL: $($sw.FullName)" }
          $p = Start-Process -FilePath "dist\STEP-Viewer-MK1\STEP-Viewer-MK1.exe" `
               -ArgumentList '--smoketest', 'beispiele\Halter-Baugruppe.step' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "::warning::Programm reagiert nach 90 s nicht" }
          Remove-Item "dist\STEP-Viewer-MK1\opengl32.dll" -ErrorAction SilentlyContinue
          Write-Host "----- Protokoll -----"
          Get-Content "$env:LOCALAPPDATA\STEP-Viewer-MK1\logs\stepviewer.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Starttest fehlgeschlagen (Code $($p.ExitCode))" }

      - name: Portable ZIP packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip -mx=7 "release\STEP-Viewer-MK1-${{ steps.ver.outputs.version }}-Windows-portable.zip" ".\dist\STEP-Viewer-MK1"
          if ($LASTEXITCODE -ne 0) { throw "ZIP fehlgeschlagen" }

      - name: Setup bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\STEP-Viewer-MK1.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }

      - uses: actions/upload-artifact@v4
        with:
          name: STEP-Viewer-MK1-Windows
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS (App, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Icon und Version
        id: ver
        run: |
          python tools/make_icon.py
          VERSION=$(python tools/make_version_info.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: App bauen (PyInstaller)
        run: pyinstaller --noconfirm STEP-Viewer-MK1.spec

      - name: Selbsttest (Beispieldatei laden)
        run: |
          "dist/STEP-Viewer-MK1.app/Contents/MacOS/STEP-Viewer-MK1" --selftest beispiele/Halter-Baugruppe.step

      - name: Starttest Oberfläche (Fenster + 3D-Ansicht)
        # Mac-Runner haben eingeschränktes OpenGL – ein Fehlschlag stoppt den Build nicht,
        # das Protokoll zeigt aber, ob und wo das Programm hängt.
        continue-on-error: true
        run: |
          APP="dist/STEP-Viewer-MK1.app/Contents/MacOS/STEP-Viewer-MK1"
          "$APP" --smoketest beispiele/Halter-Baugruppe.step &
          PID=$!
          for i in $(seq 1 90); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          if kill -0 $PID 2>/dev/null; then
            echo "::warning::Programm reagiert nach 90 s nicht – wird beendet"
            echo "----- Nativer Aufrufstapel (sample) -----"
            sample $PID 3 -file sample.txt >/dev/null 2>&1 || true
            # nur den Haupt-Thread ausgeben (gekürzt)
            awk '/Thread_[0-9]+.*DispatchQueue_1/{p=1} p{print; n++} n>120{exit}' sample.txt || true
            kill -9 $PID; CODE=124
          else
            wait $PID; CODE=$?
          fi
          echo "----- Protokoll -----"
          cat ~/Library/Logs/STEP-Viewer-MK1/stepviewer.log || true
          echo "Exit-Code: $CODE"
          exit $CODE

      - name: Signieren (ad hoc) und DMG/ZIP packen
        run: |
          codesign --force --deep --sign - "dist/STEP-Viewer-MK1.app" || true
          mkdir -p release dmg
          cp -R "dist/STEP-Viewer-MK1.app" dmg/
          ln -s /Applications dmg/Programme
          hdiutil create -volname "STEP-Viewer-MK1" -srcfolder dmg -ov -format UDZO \
            "release/STEP-Viewer-MK1-${{ steps.ver.outputs.version }}-macOS.dmg"
          ditto -c -k --keepParent "dist/STEP-Viewer-MK1.app" \
            "release/STEP-Viewer-MK1-${{ steps.ver.outputs.version }}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: STEP-Viewer-MK1-macOS
          path: release/*
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release-Text aus CHANGELOG
        run: |
          VERSION="${{ needs.windows.outputs.version }}"
          awk -v v="## $VERSION" '$0 ~ "^## " {p = ($0 ~ "^"v)} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Version $VERSION" > release-notes.md; fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: STEP-Viewer-MK1 v${{ needs.windows.outputs.version }}
          body_path: release-notes.md
          files: artifacts/*
          make_latest: true
